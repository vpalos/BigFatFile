<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>BigFatFile Architecture</title>
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, minimum-scale=1.0"
        />
        <meta
            name="description"
            content="Architecture documents for BigFatFile v2"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css"
        />
        <style>
            :root {
                --theme-color: #2f6fed;
            }
            .markdown-section {
                max-width: 60em;
            }
            .markdown-section pre > code {
                font-size: 0.85em;
            }
            /* A diagram may be wider than the text, up to the width of the page beside the sidebar. */
            .markdown-section .mermaid {
                width: max-content;
                max-width: calc(100vw - 340px);
                position: relative;
                left: 50%;
                transform: translateX(-50%);
                overflow-x: auto;
            }
            @media screen and (max-width: 768px) {
                .markdown-section .mermaid {
                    max-width: calc(100vw - 30px);
                }
            }
        </style>
    </head>
    <body>
        <div id="app">Loading...</div>
        <script>
            window.$docsify = {
                name: "BigFatFile",
                homepage: "Architecture.md",
                loadSidebar: true,
                subMaxLevel: 2,
                auto2top: true,
                maxLevel: 3,
                search: {
                    placeholder: "Search",
                    noData: "No results",
                    depth: 3,
                },
            };
        </script>
        <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
        <script>
            // A wide diagram keeps its size and scrolls, because shrinking it makes the text too small.
            mermaid.initialize({
                startOnLoad: false,
                theme: "neutral",
                themeVariables: {
                    noteBkgColor: "#fff8c4",
                    noteBorderColor: "#d6c96a",
                    noteTextColor: "#333",
                },
                flowchart: { useMaxWidth: false },
                sequence: { useMaxWidth: false },
            });
        </script>
        <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/docsify-mermaid.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-csharp.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
    </body>
</html>
