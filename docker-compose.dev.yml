# The development override, used by `./dev up`:
# - runs the Origin from the checkout under `dotnet watch`, with Hot Reload;
# - seeds a demo tenant, user and clients;
# - adds the Aspire dashboard (traces, metrics and logs).

services:
  origin:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /src
    command:
      - dotnet
      - watch
      - run
      - --project=server/BigFatFile.Origin
      - --no-launch-profile
      - --non-interactive
      - --property:OpenApiGenerateDocuments=false
    volumes:
      - .:/src:ro # read-only, so it doesn't write in the codebase
      - nuget-packages:/root/.nuget/packages
      - build-output:/artifacts
    environment:
      ArtifactsPath: /artifacts
      ASPNETCORE_ENVIRONMENT: Development
      BFF_DEVELOPMENT_SEED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      # dotnet watch ignores stop signals. The init process sends them to every process in
      # the group, so the server shuts down cleanly; Docker kills the rest after 3 seconds.
      TINI_KILL_PROCESS_GROUP: "1"
    init: true
    stop_grace_period: 3s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 10s
      start_period: 5m
      start_interval: 2s
    # Development needs no BBR, and not every development host has the module.
    sysctls: !reset {}
    depends_on:
      aspire:
        condition: service_started

  db:
    ports:
      - "${BFF_DB_PORT:-5432}:5432"

  aspire:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "${BFF_ASPIRE_PORT:-18888}:18888"

volumes:
  nuget-packages:
  build-output:
